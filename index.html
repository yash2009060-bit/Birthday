<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday 🎉</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  overflow: hidden;
  text-align: center;
}

/* PAGE 1 */
#page1 {
  height: 100vh;
  background: black;
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

h1 {
  font-size: 3em;
  animation: glow 1.5s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px pink; }
  to { text-shadow: 0 0 30px hotpink; }
}

/* Sparkles */
.sparkle {
  position: absolute;
  width: 5px;
  height: 5px;
  background: white;
  animation: fall 5s linear infinite;
}

@keyframes fall {
  0% { transform: translateY(-100vh); opacity: 1; }
  100% { transform: translateY(100vh); opacity: 0; }
}

button {
  padding: 12px 25px;
  font-size: 18px;
  border: none;
  border-radius: 20px;
  background: hotpink;
  color: white;
  cursor: pointer;
  margin-top: 20px;
}

/* PAGE 2 */
#page2 {
  display: none;
  height: 100vh;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  color: black;
  padding: 20px;
}

/* SLIDESHOW */
.slideshow {
  position: relative;
  max-width: 300px;
  margin: auto;
}

.slide {
  display: none;
}

.slide img {
  width: 100%;
  border-radius: 20px;
}

/* message */
.message {
  margin-top: 20px;
  font-size: 18px;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1">
  <h1>✨ Happy Birthday 🎂 ✨</h1>
  <p>Someone special deserves something special 💖</p>
  <button onclick="nextPage()">Click Here 🎁</button>
</div>

<!-- PAGE 2 -->
<div id="page2">

  <h2>For You 💕</h2>

  <div class="slideshow">
    <div class="slide"><img src="photo1.jpg"></div>
    <div class="slide"><img src="photo2.jpg"></div>
    <div class="slide"><img src="photo3.jpg"></div>
  </div>

  <div class="message">
    Happy Birthday! 🎉  
    Tu meri life ka best part hai honestly.  
    Jab bhi tu saath hoti hai na sab kuch easy lagta hai.  
    Aaj ka din bas tere liye hai — smile karte rehna 😌💖  
  </div>

</div>

<!-- MUSIC -->
<audio id="song" src="song.mp3"></audio>

<script>
// sparkle
for (let i = 0; i < 50; i++) {
  let s = document.createElement("div");
  s.className = "sparkle";
  s.style.left = Math.random() * 100 + "vw";
  s.style.animationDuration = (Math.random() * 3 + 2) + "s";
  document.body.appendChild(s);
}

// page change
function nextPage() {
  document.getElementById("page1").style.display = "none";
  document.getElementById("page2").style.display = "block";
  document.getElementById("song").play();
  showSlides();
}

// slideshow
let index = 0;
function showSlides() {
  let slides = document.getElementsByClassName("slide");
  for (let i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";
  }
  index++;
  if (index > slides.length) { index = 1 }
  slides[index - 1].style.display = "block";
  setTimeout(showSlides, 2000);
}
</script>

</body>
</html>
